name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_zigbuild: true
            bin_name: ov-agy
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_zigbuild: true
            bin_name: ov-agy
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            use_zigbuild: false
            bin_name: ov-agy
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-14
            use_zigbuild: false
            bin_name: ov-agy
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_zigbuild: false
            bin_name: ov-agy.exe
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild (Linux musl)
        if: matrix.use_zigbuild
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild crate
        if: matrix.use_zigbuild
        run: cargo install --locked cargo-zigbuild

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary (Linux musl)
        if: matrix.use_zigbuild
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build release binary (macOS / Windows)
        if: ${{ !matrix.use_zigbuild }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify tag matches plugin.json version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(jq -r '.version' .antigravity-plugin/plugin.json)"
          if [ "${TAG_VERSION}" != "${MANIFEST_VERSION}" ]; then
            echo "Release tag v${TAG_VERSION} does not match plugin.json version ${MANIFEST_VERSION}" >&2
            exit 1
          fi

      - name: Package flat archive & verify layout
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="ov-agy-v${VERSION}-${{ matrix.target }}.${{ matrix.archive_ext }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.bin_name }}"
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            (cd dist && 7z a -tzip "../${ARCHIVE}" "${{ matrix.bin_name }}")
            VERIFY_DIR="$(mktemp -d)"
            7z x -y "${ARCHIVE}" "-o${VERIFY_DIR}" >/dev/null
            test -f "${VERIFY_DIR}/${{ matrix.bin_name }}"
            rm -rf "${VERIFY_DIR}"
          else
            chmod 0755 "dist/${{ matrix.bin_name }}"
            tar -C dist -czf "${ARCHIVE}" "${{ matrix.bin_name }}"
            ENTRIES="$(tar -tzf "${ARCHIVE}")"
            if [ "${ENTRIES}" != "${{ matrix.bin_name }}" ]; then
              echo "Unexpected tar layout in ${ARCHIVE}: ${ENTRIES}" >&2
              exit 1
            fi
          fi
          rm -rf dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: ov-agy-v*

  publish:
    name: Publish Release & Checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          cd artifacts
          sha256sum ov-agy-v* | sort -k2 > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ov-agy-v*
            artifacts/checksums.txt
          generate_release_notes: true
