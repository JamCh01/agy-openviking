name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "README*.md"
      - "docs/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Clippy & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain from rust-toolchain.toml
        uses: dtolnay/rust-toolchain@master

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --locked

      - name: Validate JSON manifests & plugin layout
        run: |
          jq empty .antigravity-plugin/plugin.json
          jq empty hooks.json
          jq empty mcp_config.json
          test ! -e bin
          test -x scripts/ov-agy
          test -x scripts/fetch-binary.sh
          test -f assets/logo.svg

  deny:
    name: Supply-Chain & License Audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain from rust-toolchain.toml
        uses: dtolnay/rust-toolchain@master

      - name: Run cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --locked
