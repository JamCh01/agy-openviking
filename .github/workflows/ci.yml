name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Clippy & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit & integration tests
        run: cargo test

      - name: Validate JSON manifests & plugin layout
        run: |
          jq empty .antigravity-plugin/plugin.json
          jq empty hooks.json
          jq empty mcp_config.json
          test ! -e bin
          test -x scripts/ov-agy
          test -x scripts/fetch-binary.sh
          test -f assets/logo.svg
