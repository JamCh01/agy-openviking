[package]
name = "ov-agy"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Zero-Node-dependency Google Antigravity CLI (agy) plugin for OpenViking"
repository = "https://github.com/JamCh01/agy-openviking"

[[bin]]
name = "ov-agy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5"
eventsource-stream = "0.2"
fs4 = "0.12"
futures-util = "0.3"
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "io-std", "io-util", "time", "process", "sync", "macros", "fs", "net"] }
url = "2"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "process", "fs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
