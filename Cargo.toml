[package]
name = "ov-agy"
version = "0.2.0"
edition = "2021"
rust-version = "1.99.0"
license = "Apache-2.0"
description = "Zero-Node-dependency Google Antigravity CLI (agy) plugin for OpenViking"
repository = "https://github.com/JamCh01/agy-openviking"

[[bin]]
name = "ov-agy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
eventsource-stream = "0.2"
fs4 = "0.12"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
regex = "1"
# rustls with two root sets: the bundled Mozilla roots and the operating system's trust store.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "stream"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "io-std", "io-util", "time", "macros", "net", "sync"] }
url = "2"

[dev-dependencies]
axum = "0.8"
# A private-CA TLS server for the trust-store tests, on the same ring provider reqwest uses.
rcgen = "0.13"
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
cast_possible_truncation = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
